[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yessir"
version = "0.1.0"
description = "yessir: experiments in getting transformers to follow rules they are given in context"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["yessir*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["experiments"]
