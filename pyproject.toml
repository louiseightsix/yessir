[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transformadder"
version = "0.1.0"
description = "TransformAdder: Zero-Shot Algorithmic Generalisation of Base-Conditioned Addition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
]

[tool.setuptools.packages.find]
include = ["transformadder*", "scripts*"]
