[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yessir"
version = "0.1.0"
description = "yessir: playground for exploring rule-following behaviour in transformers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["yessir*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["experiments", "yessir"]
